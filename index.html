<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Open session</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:3em auto;max-width:32em;padding:0 1em}</style>
</head>
<body>
<p id="msg">Opening session in Claude…</p>
<p><a id="link" href="#">Open in Claude</a></p>
<p id="close">You can close this tab.</p>
<script>
(function () {
  var id = location.hash.slice(1);
  if (!/^local_[0-9a-f-]{36}$/.test(id)) {
    document.getElementById('msg').textContent = 'No session id.';
    document.getElementById('link').parentNode.remove();
    document.getElementById('close').remove();
    return;
  }
  var url = 'claude://claude.ai/epitaxy/' + id;
  document.getElementById('link').href = url;
  location.href = url;
  // First visit stays open long enough to answer Chrome's "Open Claude?" prompt and tick
  // "Always allow"; after that the tab only has to outlive the launch.
  var seen = false;
  try { seen = localStorage.getItem('seen') === '1'; localStorage.setItem('seen', '1'); } catch (e) {}
  setTimeout(function () { window.close(); }, seen ? 1200 : 10000);
})();
</script>
</body>
</html>
